spring.application.name=Oppzy

server.port=8080
 
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/internship_matching?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}

spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

 

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
 

app.jwt.secret=${JWT_SECRET}

# 15 minutes
app.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}

# 7 days
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
 

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

  
app.admin.email=${ADMIN_EMAIL:admin@ewubd.edu}

app.admin.password=${ADMIN_PASSWORD:Admin@12345}

  

spring.servlet.multipart.max-file-size=50MB

spring.servlet.multipart.max-request-size=50MB

  

file.upload-dir=uploads