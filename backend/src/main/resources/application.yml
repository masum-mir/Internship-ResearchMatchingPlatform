server:
  port: 8080

spring:
  application:
    name: internship-matching-platform
  datasource:
    url: jdbc:mysql://localhost:3306/internship_matching?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    # Override in production via the JWT_SECRET environment variable (>= 256-bit / 32+ chars)
    secret: ${JWT_SECRET:dev-secret-please-change-this-to-a-long-random-value-0123456789abcdef}
    access-expiration-ms: 900000        # 15 minutes
    refresh-expiration-ms: 604800000    # 7 days
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  admin:
    # Seeded on first startup if no admin exists. Change in production.
    email: ${ADMIN_EMAIL:admin@ewu.edu}
    password: ${ADMIN_PASSWORD:Admin@12345}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
