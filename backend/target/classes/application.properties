# ===============================
# SERVER
# ===============================
server.port=8080


# ===============================
# APPLICATION
# ===============================
spring.application.name=internship-matching-platform


# ===============================
# MYSQL DATABASE
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/internship_matching?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# ===============================
# JACKSON
# ===============================
spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-unknown-properties=false


# ===============================
# FILE UPLOAD
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# ===============================
# JWT CONFIGURATION
# ===============================
app.jwt.secret=dev-secret-please-change-this-to-a-long-random-value-0123456789abcdef
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000


# ===============================
# CORS
# ===============================
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000


# ===============================
# DEFAULT ADMIN CREDENTIALS
# ===============================
app.admin.email=admin@ewubd.edu
app.admin.password=Admin@12345


# ===============================
# SWAGGER
# ===============================
springdoc.swagger-ui.path=/swagger-ui.html